name: Build Kernel

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted
    permissions:
      contents: write
    strategy:
      matrix:
        target: [x86_64-ubuntu2604]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache kernel source and patches
        uses: actions/cache@v4
        with:
          path: |
            ./*.tar.xz
            ./*.patch.xz
          key: kernel-source-${{ matrix.target }}-7.0.1

      - name: Build Kernel inside Ubuntu 24.04 Docker Container
        run: |
          # Use system ccache dir or user ccache dir
          HOST_CCACHE="/var/cache/ccache"
          if [ ! -d "$HOST_CCACHE" ] || [ ! -w "$HOST_CCACHE" ]; then
            HOST_CCACHE="$HOME/.cache/ccache"
          fi
          mkdir -p "$HOST_CCACHE"
          echo "Using host ccache directory: $HOST_CCACHE"

          docker run --rm \
            -v "$PWD:/workspace" \
            -v "$HOST_CCACHE:/root/.cache/ccache" \
            -w /workspace \
            -e CCACHE_DIR=/root/.cache/ccache \
            -e CCACHE_MAXSIZE=50G \
            ubuntu:24.04 bash -c "
              apt-get update && \
              apt-get install -y build-essential bc kmod cpio flex bison \
                libncurses-dev libelf-dev libssl-dev dwarves rsync \
                debhelper libdw-dev zstd wget xz-utils patch git ccache && \
              bash ./build.sh ${{ matrix.target }} && \
              echo '=== ccache statistics ===' && \
              ccache -s
            "

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-packages-${{ matrix.target }}
          path: ./*.deb

      - name: Create release and upload packages
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ./*.deb
